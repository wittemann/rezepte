<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>html,body{margin:0;background:#e7e5e0}a{color:#1b1a17}a:hover{color:#6b665d}</style>
</helmet>
<sc-for list="{{ turns }}" as="turn" hint-placeholder-count="2">
  <section style="padding: 56px 64px 40px; font-family: 'Instrument Sans', system-ui, sans-serif; color: #1b1a17;">
    <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 36px; max-width: 760px;">
      <div style="font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #6b665d; font-weight: 600;">{{ turn.eyebrow }}</div>
      <div style="font-size: 32px; font-weight: 600; letter-spacing: -0.02em;">{{ turn.title }}</div>
      <div style="font-size: 15px; line-height: 1.5; color: #4a463f; text-wrap: pretty;">{{ turn.desc }}</div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start;">
      <sc-for list="{{ turn.options }}" as="o" hint-placeholder-count="2">
        <div id="{{ o.id }}" style="display: flex; flex-direction: column; gap: 16px; width: 414px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="background: #1b1a17; color: #f6f4ef; font-size: 13px; font-weight: 600; padding: 4px 9px; border-radius: 6px;">{{ o.id }}</div>
            <div style="font-size: 18px; font-weight: 600;">{{ o.name }}</div>
          </div>
          <div style="font-size: 14px; line-height: 1.5; color: #4a463f; min-height: 42px; text-wrap: pretty;">{{ o.desc }}</div>
          <div style="width: 414px; height: 868px; border-radius: 58px; background: #16150f; padding: 12px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.35);">
            <div style="width: 390px; height: 844px; border-radius: 46px; overflow: hidden; position: relative;">
              <dc-import name="Kochbuch App" variant="{{ o.key }}" dark="{{ dark }}" show-stubs="{{ showStubs }}" force-login="{{ o.forceLogin }}" in-frame="{{ true }}" style="width: 100%; height: 100%;" hint-size="390px,844px"></dc-import>
              <div style="position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; pointer-events: none;"></div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </section>
</sc-for>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showStubs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      dark: !!this.props.dark, showStubs: this.props.showStubs !== false,
      turns: [
        { eyebrow: 'Runde 6', title: 'Login', desc: 'Nur ein Passwortfeld. Maulti hält ein Vorhängeschloss und zwinkert; bei falschem Passwort grübelt er. Demo-Passwort: maultasche. In der echten App wird das Passwort serverseitig geprüft und ein Cookie gesetzt.',
          options: [{ id: '6a', key: 'playful', name: 'Login', desc: 'Startet immer mit dem Login.', forceLogin: true }] },
        { eyebrow: 'Runde 5', title: 'Verspielt, überarbeitet', desc: 'Maulti ausgearbeitet (Augenbrauen, Wellenrand, Füße, neue Wecker-Pose). Stöbern mit Symbolen, Rezeptliste mit Mahlzeit-Umschalter und separatem Filter, Timer an Schritten mit Zeitangabe Wischen im Kochmodus, Neu als normaler Tab rechts.',
          options: [{ id: '5a', key: 'playful', name: 'Verspielt · Sticker', desc: 'Weiterentwicklung von 4a.' }] },
        { eyebrow: 'Runde 4', title: 'Drei Varianten der verspielten Richtung', desc: 'Gleiche Struktur und gleiches Maskottchen Maulti, unterschiedliche Formensprache: Farbe, Konturen, Schatten und Schrift.',
          options: [
            { id: '4a', key: 'playful', name: 'Sticker', desc: 'Pastell je Kategorie, feine dunkle Konturen, Schatten nach unten wie aufgeklebte Sticker. Runde Schrift Fredoka.' },
            { id: '4b', key: 'playsoft', name: 'Weich', desc: 'Lavendel-Töne, keine Konturen, weiche schwebende Schatten. Freundlich und ruhiger, Schrift Baloo 2.' },
            { id: '4c', key: 'playcomic', name: 'Comic', desc: 'Kräftiges Gelb, dicke Konturen, versetzte harte Schatten. Laut und fröhlich, Schrift Bricolage Grotesque.' }
          ] }
      ]
    };
  }
}
</script>
</body>
</html>
