<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 120 120" style="display: block; overflow: visible;">
  <ellipse cx="60" cy="116" rx="32" ry="4" fill="rgba(0,0,0,.14)"></ellipse>
  <ellipse cx="45" cy="109" rx="8" ry="5" fill="#e3b777" stroke="#3b2a1d" stroke-width="3"></ellipse>
  <ellipse cx="75" cy="109" rx="8" ry="5" fill="#e3b777" stroke="#3b2a1d" stroke-width="3"></ellipse>
  <rect x="14" y="40" width="92" height="66" rx="11" fill="#f8e4bb" stroke="#3b2a1d" stroke-width="3"></rect>
  <path d="{{ forks }}" fill="none" stroke="#d2a86a" stroke-width="2.2" stroke-linecap="round"></path>
  <rect x="24" y="50" width="72" height="46" rx="17" fill="#f0cc8c" stroke="#c9985a" stroke-width="2"></rect>
  <path d="M30 60 C33 55 38 53 44 53" fill="none" stroke="#fff6df" stroke-width="3" stroke-linecap="round"></path>
  <g fill="#7ea45b" opacity=".75"><circle cx="31" cy="88" r="1.6"></circle><circle cx="36" cy="91" r="1.1"></circle><circle cx="88" cy="86" r="1.5"></circle><circle cx="84" cy="91" r="1.1"></circle><circle cx="89" cy="60" r="1.2"></circle></g>
  <g fill="none" stroke="#3b2a1d" stroke-width="2.6" stroke-linecap="round">
    <path d="{{ browL }}"></path><path d="{{ browR }}"></path>
  </g>
  <g display="{{ v.eyesOpen }}">
    <ellipse cx="48" cy="{{ eyeY }}" rx="4.6" ry="5.6" fill="#3b2a1d"></ellipse><circle cx="49.6" cy="{{ hlY }}" r="1.8" fill="#fff"></circle>
    <g display="{{ v.rightEye }}"><ellipse cx="72" cy="{{ eyeY }}" rx="4.6" ry="5.6" fill="#3b2a1d"></ellipse><circle cx="73.6" cy="{{ hlY }}" r="1.8" fill="#fff"></circle></g>
  </g>
  <g display="{{ v.eyesClosed }}" fill="none" stroke="#3b2a1d" stroke-width="3" stroke-linecap="round">
    <path d="M43 70 Q48 74 53 70"></path><path d="M67 70 Q72 74 77 70"></path>
  </g>
  <ellipse cx="37" cy="80" rx="6" ry="3.6" fill="#f39a8c" opacity=".9"></ellipse><ellipse cx="83" cy="80" rx="6" ry="3.6" fill="#f39a8c" opacity=".9"></ellipse>
  <path display="{{ v.smile }}" d="M54 80 Q60 87 66 80" fill="none" stroke="#3b2a1d" stroke-width="3" stroke-linecap="round"></path>
  <g display="{{ v.open }}"><path d="M52 79 Q60 93 68 79 Z" fill="#3b2a1d" stroke="#3b2a1d" stroke-width="2" stroke-linejoin="round"></path><path d="M56 86 Q60 89.5 64 86" fill="#f39a8c"></path></g>
  <ellipse display="{{ v.oh }}" cx="60" cy="84" rx="3.2" ry="3.8" fill="#3b2a1d"></ellipse>
  <g fill="none" stroke="#3b2a1d" stroke-width="5" stroke-linecap="round">
    <g display="{{ v.wave }}"><path d="M15 78 Q6 84 9 95"></path><path d="M105 68 Q114 58 111 43"></path></g>
    <g display="{{ v.think }}"><path d="M15 78 Q6 86 9 97"></path><path d="M105 80 Q104 94 84 92"></path></g>
    <g display="{{ v.cook }}"><path d="M15 78 Q6 86 9 97"></path><path d="M105 76 Q112 74 113 65"></path></g>
    <g display="{{ v.cheer }}"><path d="M16 64 Q6 52 10 36"></path><path d="M104 64 Q114 52 110 36"></path></g>
    <g display="{{ v.sleep }}"><path d="M15 82 Q7 90 13 99"></path><path d="M105 82 Q113 90 107 99"></path></g>
    <g display="{{ v.heart }}"><path d="M16 80 Q24 97 48 95"></path><path d="M104 80 Q96 97 72 95"></path></g>
    <g display="{{ v.alarm }}"><path d="M16 66 Q6 58 9 44"></path><path d="M104 70 Q110 64 108 56"></path></g>
    <g display="{{ v.lock }}"><path d="M15 78 Q6 86 9 97"></path><path d="M104 76 Q113 80 112 90"></path></g>
  </g>
  <g fill="#f8e4bb" stroke="#3b2a1d" stroke-width="3">
    <circle display="{{ v.wave }}" cx="111" cy="41" r="5.5"></circle>
    <circle display="{{ v.think }}" cx="83" cy="92" r="5.5"></circle>
    <g display="{{ v.cheer }}"><circle cx="10" cy="34" r="5.5"></circle><circle cx="110" cy="34" r="5.5"></circle></g>
    <circle display="{{ v.alarm }}" cx="9" cy="42" r="5.5"></circle>
  </g>
  <path display="{{ v.wave }}" d="M118 31 l6 -4 M120 42 l7 0" stroke="{{ accent }}" stroke-width="3" stroke-linecap="round"></path>
  <text display="{{ v.think }}" x="100" y="34" font-size="24" font-weight="700" fill="{{ accent }}" font-family="Fredoka, system-ui">?</text>
  <g display="{{ v.cook }}">
    <path d="M113 66 L117 30" stroke="#b07a45" stroke-width="4" stroke-linecap="round"></path><ellipse cx="117.5" cy="25" rx="5" ry="7" fill="#b07a45" stroke="#3b2a1d" stroke-width="2"></ellipse>
    <circle cx="46" cy="25" r="10" fill="#fff" stroke="#3b2a1d" stroke-width="3"></circle><circle cx="74" cy="25" r="10" fill="#fff" stroke="#3b2a1d" stroke-width="3"></circle><circle cx="60" cy="18" r="12" fill="#fff" stroke="#3b2a1d" stroke-width="3"></circle>
    <rect x="41" y="23" width="38" height="10" fill="#fff"></rect>
    <rect x="40" y="30" width="40" height="12" rx="3" fill="#fff" stroke="#3b2a1d" stroke-width="3"></rect>
  </g>
  <g display="{{ v.cheer }}">
    <rect x="30" y="14" width="6" height="6" rx="1" fill="{{ accent }}" transform="rotate(20 33 17)"></rect><circle cx="60" cy="14" r="3.5" fill="#f2c94c"></circle>
    <rect x="84" y="16" width="6" height="6" rx="1" fill="#6fcf97" transform="rotate(-25 87 19)"></rect><circle cx="44" cy="30" r="2.5" fill="#6fcf97"></circle><circle cx="78" cy="30" r="2.5" fill="{{ accent }}"></circle>
  </g>
  <g display="{{ v.sleep }}" fill="{{ accent }}" font-family="Fredoka, system-ui" font-weight="700"><text x="92" y="34" font-size="16">z</text><text x="104" y="22" font-size="12">z</text><text x="113" y="12" font-size="9">z</text></g>
  <path display="{{ v.heart }}" d="M60 106 C47 98 47 87 54 87 C57.5 87 60 90 60 90 C60 90 62.5 87 66 87 C73 87 73 98 60 106 Z" fill="{{ accent }}" stroke="#3b2a1d" stroke-width="2.5" stroke-linejoin="round"></path>
  <g display="{{ v.lock }}">
    <path d="M106 92 V86 a7 7 0 0 1 14 0 V92" fill="none" stroke="#3b2a1d" stroke-width="4" stroke-linecap="round"></path>
    <rect x="101" y="91" width="24" height="19" rx="5" fill="{{ accent }}" stroke="#3b2a1d" stroke-width="3"></rect>
    <circle cx="113" cy="98.5" r="2.6" fill="#3b2a1d"></circle><path d="M113 100 V104" stroke="#3b2a1d" stroke-width="2.6" stroke-linecap="round"></path>
    <path d="M129 84 l5 -3 M130 94 l6 0 M126 76 l2 -5" stroke="#f2c94c" stroke-width="3" stroke-linecap="round"></path>
  </g>
  <g display="{{ v.wink }}" fill="none" stroke="#3b2a1d" stroke-width="3" stroke-linecap="round"><path d="M67 69 Q72 73 77 69"></path></g>
  <g display="{{ v.alarm }}">
    <circle cx="106" cy="40" r="15" fill="#fff" stroke="#3b2a1d" stroke-width="3"></circle>
    <circle cx="96" cy="25" r="4.5" fill="{{ accent }}" stroke="#3b2a1d" stroke-width="2.5"></circle><circle cx="116" cy="25" r="4.5" fill="{{ accent }}" stroke="#3b2a1d" stroke-width="2.5"></circle>
    <path d="M106 31 V40 L112 44" fill="none" stroke="#3b2a1d" stroke-width="2.5" stroke-linecap="round"></path>
    <path d="M88 30 l-5 -4 M86 40 l-6 0" stroke="{{ accent }}" stroke-width="3" stroke-linecap="round"></path>
  </g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;pose&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;wave&quot;,&quot;think&quot;,&quot;cook&quot;,&quot;cheer&quot;,&quot;sleep&quot;,&quot;heart&quot;,&quot;alarm&quot;,&quot;lock&quot;],&quot;default&quot;:&quot;wave&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:96,&quot;tsType&quot;:&quot;number&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e8674f&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  forks() {
    let d = '';
    for (let x = 24; x <= 96; x += 6) d += 'M' + x + ' 43.5v4.5M' + x + ' 98v4.5';
    for (let y = 52; y <= 94; y += 6) d += 'M17.5 ' + y + 'h4.5M98 ' + y + 'h4.5';
    return d;
  }
  renderVals() {
    const p = this.props.pose || 'wave';
    const on = b => (b ? 'inline' : 'none');
    const closed = p === 'sleep';
    const brows = {
      think: ['M42 59 Q47 55 53 58', 'M67 56 Q73 54 78 57'],
      alarm: ['M42 56 Q47 59 53 58', 'M67 58 Q73 59 78 56'],
      cheer: ['M42 58 Q47 53 53 57', 'M67 57 Q73 53 78 58'],
      sleep: ['M43 63 Q48 62 52 63', 'M68 63 Q72 62 77 63']
    }[p] || ['M43 59 Q48 56 52 59', 'M68 59 Q72 56 77 59'];
    if (!this._f) this._f = this.forks();
    return {
      size: this.props.size || 96, accent: this.props.accent || '#e8674f', forks: this._f,
      eyeY: p === 'think' ? 66 : 69, hlY: p === 'think' ? 63.8 : 66.8, browL: brows[0], browR: brows[1],
      v: {
        eyesOpen: on(!closed), eyesClosed: on(closed),
        rightEye: on(p !== 'lock'), wink: on(p === 'lock'), lock: on(p === 'lock'),
        smile: on(p === 'wave' || p === 'cook' || p === 'heart' || p === 'lock'), open: on(p === 'cheer' || p === 'alarm'), oh: on(p === 'think' || p === 'sleep'),
        wave: on(p === 'wave'), think: on(p === 'think'), cook: on(p === 'cook'), cheer: on(p === 'cheer'), sleep: on(p === 'sleep'), heart: on(p === 'heart'), alarm: on(p === 'alarm')
      }
    };
  }
}
</script>
</body>
</html>
