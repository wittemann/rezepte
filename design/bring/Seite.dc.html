<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Rezeptseite mit Einkaufslisten-Button</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 54px 0 34px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: Nunito, system-ui, sans-serif; overflow: hidden; {{ themeVars }}">
  <div style="display: flex; gap: 10px; margin: 0 16px; flex-wrap: wrap">
    <div style="padding: 8px 12px; background: var(--surface); border: 2.5px solid var(--outline); border-radius: 20px">
      <div style="font-size: 13px; font-weight: 700; color: var(--muted)">Arbeitszeit</div>
      <div style="font-family: Fredoka, system-ui, sans-serif; font-size: 18px; font-weight: 600">15 Min.</div>
    </div>
    <div style="padding: 8px 12px; background: var(--surface); border: 2.5px solid var(--outline); border-radius: 20px">
      <div style="font-size: 13px; font-weight: 700; color: var(--muted)">Gesamtzeit</div>
      <div style="font-family: Fredoka, system-ui, sans-serif; font-size: 18px; font-weight: 600">45 Min.</div>
    </div>
  </div>

  <section style="display: flex; flex-direction: column; gap: 12px; padding: 26px 16px 0">
    <div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; align-items: center; padding: 0 4px">
      <h2 style="margin: 0; font-family: Fredoka, system-ui, sans-serif; font-size: 22px; font-weight: 600">Zutaten</h2>
      <div style="display: flex; align-items: center; gap: 4px">
        <button type="button" aria-label="Weniger Portionen" style="width: 44px; height: 44px; padding: 0; border-radius: 22px; background: var(--surface); color: var(--ink); border: 2.5px solid var(--outline); box-shadow: 0 3px 0 var(--outline); font-size: 22px; font-weight: 800; cursor: pointer">−</button>
        <div aria-live="polite" style="display: flex; flex-direction: column; min-width: 58px; text-align: center; line-height: 1">
          <span style="font-family: Fredoka, system-ui, sans-serif; font-size: 22px; font-weight: 600">4</span>
          <span style="font-size: 12px; font-weight: 800; color: var(--muted)">Portionen</span>
        </div>
        <button type="button" aria-label="Mehr Portionen" style="width: 44px; height: 44px; padding: 0; border-radius: 22px; background: var(--accent); color: var(--on-accent); border: 2.5px solid var(--outline); box-shadow: 0 3px 0 var(--outline); font-size: 22px; font-weight: 800; cursor: pointer">+</button>
      </div>
    </div>

    <ul style="margin: 0; padding: 6px 16px; list-style: none; background: var(--surface); border: 2.5px solid var(--outline); border-radius: 22px">
      <sc-for list="{{ lines }}" as="line" hint-placeholder-count="7">
        <sc-if value="{{ line.heading }}" hint-placeholder-val="{{ false }}">
          <li style="padding: 14px 0 2px; color: var(--accent); font-family: Fredoka, system-ui, sans-serif; font-size: 15px; font-weight: 600">{{ line.text }}</li>
        </sc-if>
        <sc-if value="{{ line.item }}" hint-placeholder-val="{{ true }}">
          <li style="display: flex; gap: 12px; padding: 11px 0; border-bottom: 2px dotted var(--line); line-height: 1.35">
            <span style="flex: none; width: 72px; font-weight: 800">{{ line.amount }}</span>
            <span style="flex: 1; min-width: 0">{{ line.text }}</span>
          </li>
        </sc-if>
      </sc-for>
    </ul>

    <button type="button" aria-haspopup="dialog" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 26px; background: var(--surface); color: var(--ink); border: 2.5px solid var(--outline); box-shadow: 0 3px 0 var(--outline); font-family: Fredoka, system-ui, sans-serif; font-size: 17px; font-weight: 600; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="display: block"><path d="M3.5 4.5h2.2l2.1 10.2a1.5 1.5 0 0 0 1.5 1.2h7.9a1.5 1.5 0 0 0 1.5-1.1l1.6-6.3H7M10 20.2h.01M17 20.2h.01" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"></path></svg>
      Auf die Einkaufsliste
    </button>
  </section>

  <h2 style="margin: 28px 20px 0; font-family: Fredoka, system-ui, sans-serif; font-size: 22px; font-weight: 600">So geht’s</h2>

  <div style="flex: 1"></div>

  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 126px; display: flex; justify-content: center">
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 700">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display: block; flex: none"><path d="M5 12.5l4.5 4.5L19 7.5" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"></path></svg>
        {{ toastText }}
      </div>
    </div>
  </sc-if>

  <div style="margin: 0 16px">
    <button type="button" style="width: 100%; height: 62px; border-radius: 31px; background: var(--accent); color: var(--on-accent); border: 2.5px solid var(--outline); box-shadow: 0 4px 0 var(--outline); font-family: Fredoka, system-ui, sans-serif; font-size: 20px; font-weight: 600; cursor: pointer">Los, wir kochen!</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"toast":{"editor":"boolean","default":false},"added":{"editor":"int","default":5,"tsType":"number"},"$preview":{"width":390,"height":844}}'>
const THEMES = {
  light: '--bg:#fff6e8;--surface:#ffffff;--sunk:#fbe9cf;--ink:#2b2118;--muted:#6e5e4f;--line:#eddcc3;--accent:oklch(0.56 0.17 30);--on-accent:#ffffff;--outline:#2b2118;',
  dark: '--bg:#1f1826;--surface:#2b2233;--sunk:#362b40;--ink:#fbf3e6;--muted:#bcaec2;--line:#44394e;--accent:oklch(0.72 0.15 30);--on-accent:#1f1826;--outline:#0c0910;'
};
// Made-up example ingredients, not from the family's recipes
const LINES = [
  { item: true, amount: '250 g', text: 'Mehl' },
  { item: true, amount: '3', text: 'Eier' },
  { item: true, amount: '500 ml', text: 'Milch' },
  { item: true, amount: '1 Prise', text: 'Salz' },
  { item: true, amount: '2 EL', text: 'Butter zum Braten' },
  { heading: true, text: 'Zum Servieren' },
  { item: true, amount: '1 Glas', text: 'Apfelmus' },
  { item: true, amount: '', text: 'Puderzucker' }
];
class Component extends DCLogic {
  isOn(value) {
    return value === true || value === 'true';
  }
  renderVals() {
    const added = Number(this.props.added ?? 5);
    return {
      themeVars: this.isOn(this.props.dark) ? THEMES.dark : THEMES.light,
      lines: LINES,
      toast: this.isOn(this.props.toast),
      toastText: (added === 1 ? '1 Zutat ist' : added + ' Zutaten sind') + ' auf der Einkaufsliste.'
    };
  }
}
</script>
</body>
</html>
